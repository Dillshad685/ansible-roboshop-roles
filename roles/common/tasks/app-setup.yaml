- name: create roboshop user
  ansible.builtin.user:
    name: roboshop
    comment: create roboshop user
    system: true
    shell: /sbin/nologin
    home: /app
-  name: remove directory if alreadyy created
   ansible.builtin.file:
      path: /app
      state: absent
-  name: create app directory
   ansible.builtin.file:
    state: directory
    path: /app
- name: delete {{component}} file if present
  ansible.builtin.file:
    path: /tmp/{{component}}.zip
    state: absent
- name: download {{component}} files 
  ansible.builtin.get_url:
    url: https://roboshop-artifacts.s3.amazonaws.com/{{component}}-v3.zip
    dest: /tmp/{{component}}.zip
- name: copy catalgoue details
  ansible.builtin.unarchive:
    src: /tmp/{{component}}.zip
    dest: /app
    remote_src: yes