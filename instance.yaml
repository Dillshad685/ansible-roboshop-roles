- name: create ec2instance
  hosts: local
  connection: local
  vars:
    sg_id: sg-006aa647aaae5e2ce
    ami_id: ami-0220d79f3f480ecf5
    zone_id: Z0052297OSQD07R4N2HT
    domain_name: dillshad.shop
    # instances:
    # - mongodb
    # - redis
  tasks:
  - name: create instance
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      instance_type: t3.micro
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      tags:
        Name: "{{ item }}"
    loop: "{{ instances }}"
    register: ec2_output
  - name: print the ec2_output 
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"
  - name: print public IP
    ansible.builtin.debug:
      msg: "{{ item.instances[0].public_ip_address }}" # as per the ec2-output file public IP present in items -> first value 
    loop: "{{ ec2_output.results }}" # as per the file of ec2-output publicIP present inside the results 
  - name: create r53 record
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}" # mongodb.dillshad.shop
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
  - name: create r53 for frontend
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}"
      type: A 
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      overwrite: yes
    when: item.item == "frontend"
    loop: "{{ ec2_output.results }}"